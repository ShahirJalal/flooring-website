services:
  postgres:
    image: postgres:16-alpine
    container_name: flooring-postgres

    environment:
      POSTGRES_DB: flooring
      POSTGRES_USER: flooring
      POSTGRES_PASSWORD: flooring123

    ports:
      - "5434:5432"

    volumes:
      - flooring_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flooring -d flooring"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  backend:
    build:
      context: ./backend

    container_name: flooring-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flooring
      DB_USERNAME: flooring
      DB_PASSWORD: flooring123

      JWT_SECRET: ${JWT_SECRET}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://flooring.shahirjalal.com}

      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    ports:
      - "8086:8080"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend

    container_name: flooring-frontend

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "4200:80"

volumes:
  flooring_postgres_data:
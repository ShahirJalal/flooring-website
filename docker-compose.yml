services:
  postgres:
    image: postgres:16-alpine
    container_name: flooring-postgres

    environment:
      POSTGRES_DB: flooring
      POSTGRES_USER: flooring
      POSTGRES_PASSWORD: flooring123

    ports:
      - "5432:5432"

    volumes:
      - flooring_postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  backend:
    build:
      context: ./backend

    container_name: flooring-backend

    restart: unless-stopped

    depends_on:
      - postgres

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flooring
      DB_USERNAME: flooring
      DB_PASSWORD: flooring123
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://flooring.shahirjalal.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend

    container_name: flooring-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "4200:80"

volumes:
  flooring_postgres_data:

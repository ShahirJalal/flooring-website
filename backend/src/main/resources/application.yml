spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flooring}
    username: ${DB_USERNAME:flooring}
    password: ${DB_PASSWORD:flooring123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  allowed-methods: GET,POST,PUT,DELETE,PATCH
  allowed-headers: "*"
  exposed-headers: "*"
  allow-credentials: true
  max-age: 3600

jwt:
  secret: ${JWT_SECRET}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD}